<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>＿人人人人＿ AA変換ジェネレーター</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--panel:#15151b;--panel2:#1d1d25;--text:#f5f5f7;--muted:#a7a7b0;--line:#30303a;--accent:#7c9cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:760px;margin:auto;padding:28px 0 36px}
h1{font-size:23px;line-height:1.25;margin:0 0 7px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px #0003}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:13px;background:#0f0f14;color:var(--text);padding:13px 14px;font:500 18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;outline:0;caret-color:var(--accent)}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c9cff22}
.row{display:flex;gap:9px;margin-top:11px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;font-size:14px;cursor:pointer;background:var(--panel2);color:var(--text);-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent);color:#07102b;flex:1}
button:active{transform:scale(.985);opacity:.88}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.control{background:#101016;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.control .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:750;margin-bottom:8px}
.control output{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;background:#0f0f14;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}
.preview{overflow-x:auto;overflow-y:hidden;border-radius:14px;background:#09090d;border:1px solid var(--line);padding:18px 12px;-webkit-overflow-scrolling:touch}
pre{margin:0;display:block;width:max-content;min-width:100%;text-align:center;font-family:"SF Mono","Menlo","Monaco","Cascadia Mono","Roboto Mono",ui-monospace,monospace;font-size:clamp(13px,4.2vw,20px);line-height:1.45;letter-spacing:0;white-space:pre;color:#fff;-webkit-font-smoothing:antialiased}
.status{font-size:12px;color:var(--muted);margin-top:9px;text-align:center}
details{color:var(--muted);font-size:12px;line-height:1.7}
summary{color:var(--text);font-weight:700;cursor:pointer}
.badge{display:inline-block;border:1px solid var(--line);padding:2px 7px;border-radius:999px;font-size:11px;color:var(--muted)}
@media(max-width:560px){.controls{grid-template-columns:1fr}.card{padding:14px}main{padding-top:22px}}
</style>
</head>
<body>
<main>
<h1>＿人人人人＿ AA変換ジェネレーター</h1>
<div class="sub">iPhone表示を基準に、横幅を実測して自動調整します <span class="badge">完全ブラウザ処理</span></div>

<section class="card">
<label for="input">文字を入力</label>
<textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="例：良い感じ！">良い感じ！</textarea>
<div class="row"><button id="copy" class="primary">AAをコピー</button><button id="clear">クリア</button></div>
</section>

<section class="card">
<div class="controls">
<div class="control"><div class="top"><span>左右の余白</span><output id="padOut">自動</output></div><input id="pad" type="range" min="0" max="5" step="1" value="2"></div>
<div class="control"><div class="top"><span>最適化</span><output id="modeOut">iPhone</output></div><select id="mode"><option value="iphone">iPhone（推奨）</option><option value="balanced">バランス</option><option value="classic">クラシック</option></select></div>
</div>
</section>

<section class="card">
<label>プレビュー</label>
<div class="preview"><pre id="aa"></pre></div>
<div class="status" id="status"></div>
</section>

<section class="card"><details><summary>調整方法</summary><p>Unicodeの書記素単位で文字を分割し、各文字の間に全角スペースを入れます。その後、実際のブラウザで使用中の等幅フォントを測定し、「＿」「人」「￣」「^」「Y」「＞」「＜」の実幅を含めて上下左右を総当たり。中央線と上下線の見かけの横幅が最も近くなる組み合わせを採用します。</p></details></section>
</main>

<script>
(()=> {
const $=id=>document.getElementById(id);
const input=$("input"),aa=$("aa"),status=$("status"),pad=$("pad"),padOut=$("padOut"),mode=$("mode"),modeOut=$("modeOut");
const STORAGE="aa-generator-ultra-v1";
const measure=document.createElement("span");
measure.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre;font-family:"SF Mono","Menlo","Monaco","Cascadia Mono","Roboto Mono",ui-monospace,monospace;font-size:20px;font-weight:400;line-height:1;letter-spacing:0';
document.body.appendChild(measure);
const px=t=>{measure.textContent=t||"";return measure.getBoundingClientRect().width};
function graphemes(s){return window.Intl&&Intl.Segmenter?[...new Intl.Segmenter("ja",{granularity:"grapheme"}).segment(s)].map(x=>x.segment):Array.from(s)}
const clean=s=>s.replace(/[\r\n]+/g,"").trim();
const middle=(c,l,r)=>"＞"+"　".repeat(l)+c.join("　")+"　".repeat(r)+"＜";
const top=n=>"＿"+"人".repeat(n)+"＿";
const bottom=n=>"￣"+"^Y".repeat(n)+"￣";

function optimize(chars,forced,kind){
const pads=forced===null?[0,1,2,3,4,5]:[forced];
const target=chars.length?chars.join("　"):"　";
const maxN=Math.min(90,Math.max(12,Math.ceil(px(target)/Math.max(px("人"),1))+10));
let best=null;
for(const l of pads)for(const r of pads)for(let n=1;n<=maxN;n++){
 const mid=middle(chars,l,r),t=top(n),b=bottom(n),mw=px(mid),tw=px(t),bw=px(b);
 let score=Math.abs(tw-mw)*1.35+Math.abs(bw-mw)*1.35+Math.abs(tw-bw)*.65;
 if(kind==="classic")score=Math.abs(tw-mw)+Math.abs(bw-mw)+Math.abs(tw-bw)*.2;
 if(kind==="balanced")score=Math.abs(tw-mw)*1.15+Math.abs(bw-mw)*1.15+Math.abs(tw-bw)*.4;
 score+=Math.abs(l-2)*.45+Math.abs(r-1)*.25;
 if(n>30)score+=(n-30)*.04;
 if(!best||score<best.score)best={n,l,r,mid,t,b,mw,score};
}
return best;
}
function render(save=true){
const raw=clean(input.value);
if(!raw){aa.textContent="";status.textContent="文字を入力してください";return}
const chars=graphemes(raw),v=Number(pad.value),forced=v===2?null:v;
const res=optimize(chars,forced,mode.value);
aa.textContent=res.t+"\n"+res.mid+"\n"+res.b;
status.textContent=`文字 ${chars.length}字　｜　上 ${res.n}　｜　左 ${res.l} / 右 ${res.r}　｜　幅 ${Math.round(res.mw)}px`;
padOut.textContent=forced===null?"自動":`${forced}段`;
modeOut.textContent=mode.value==="iphone"?"iPhone":mode.value==="balanced"?"バランス":"クラシック";
if(save)try{localStorage.setItem(STORAGE,JSON.stringify({text:input.value,pad:pad.value,mode:mode.value}))}catch(e){}
}
input.addEventListener("input",()=>render());
pad.addEventListener("input",()=>render());
mode.addEventListener("change",()=>render());
$("clear").addEventListener("click",()=>{input.value="";render();input.focus()});
$("copy").addEventListener("click",async()=>{
const text=aa.textContent;if(!text)return;
try{await navigator.clipboard.writeText(text)}catch(e){
const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()
}
$("copy").textContent="コピーしました ✓";setTimeout(()=>$("copy").textContent="AAをコピー",1200)
});
try{const s=JSON.parse(localStorage.getItem(STORAGE)||"null");if(s){input.value=s.text??input.value;pad.value=s.pad??"2";mode.value=s.mode??"iphone"}}catch(e){}
render(false);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render(false));
window.addEventListener("resize",()=>render(false));
})();
</script>
</body>
</html>
